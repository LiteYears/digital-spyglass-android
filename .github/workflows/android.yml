name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest ships a full Android SDK, so we only pin the pieces we
      # depend on. (android-actions/setup-android@v3 currently fails on the
      # runner image because it still tries to install the removed legacy
      # 'tools' package -> "Failed to find package 'tools'".)
      - name: Install Android SDK platforms
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build APK web assets (plain SPA, no SSR)
        run: bun run build:mobile
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Inspect build output
        run: |
          echo "--- dist ---"; ls -la dist || true
          echo "--- dist/client ---"; ls -la dist/client || true
          echo "--- dist/client/assets ---"; ls -la dist/client/assets || true
          echo "--- dist/server ---"; ls -la dist/server || true

      - name: Sync web assets to Android
        run: bunx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ghost-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
